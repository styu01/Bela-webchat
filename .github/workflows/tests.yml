name: Béla Webchat P5.9.8.3 regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Historical broker and worker regression
        run: |
          python3 -B test_p597.py
          python3 -B test_p597_install.py
          python3 -B test_unified_release.py
          python3 -B test_fault_recovery.py
      - name: Preserved P5.9.8.2 color panel tests
        working-directory: releases/P5.9.8.2
        run: |
          node --check app.js
          node test_theme_state.mjs
          python3 -B test_css_contract.py
          python3 -B -m unittest -q test_install_p5982
      - name: P5.9.8.3 Telegram mirror recovery and installer tests
        run: |
          python3 -B -m unittest -q test_mirror_recovery test_installer_p5983
      - name: Current frontend syntax and regression
        run: |
          node --check app.js
          node test_ui.mjs
          node test_ui_p5983.mjs
      - name: Current source SHA-256 integrity
        run: |
          python3 - <<'PYCI'
          import hashlib,json
          from pathlib import Path
          root=Path.cwd()
          manifest=json.loads((root/'MANIFEST_SHA256.json').read_text())
          for path,expected in manifest.items():
              actual=hashlib.sha256((root/path).read_bytes()).hexdigest()
              assert actual == expected, f'Checksum mismatch: {path}'
          print(f'PASS: {len(manifest)} current release files')
          PYCI
